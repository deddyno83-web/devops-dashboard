name: Deploy dashboard to GitHub Pages

# Builds the single-file dashboard and force-pushes dist/ to the `gh-pages`
# branch. GitHub Pages must be set to: Deploy from a branch -> gh-pages -> /(root)
#
# Why a dedicated branch: the repo root index.html is the Vite SOURCE template
# (it points at /src/main.tsx and is useless in production). If Pages serves
# main/root it publishes that source file and the site renders blank. Publishing
# the built output to its own branch removes the conflict for good.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
