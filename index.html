agation(),children:[(0,I.jsxs)(`div`,{className:`flex items-center justify-between border-b px-5 py-3.5`,children:[(0,I.jsx)(`h3`,{className:`text-sm font-semibold`,children:n}),(0,I.jsx)(z,{size:`icon`,variant:`ghost`,onClick:t,"aria-label":`Chiudi`,children:(0,I.jsx)(Le,{})})]}),(0,I.jsx)(`div`,{className:`max-h-[70vh] overflow-y-auto px-5 py-4`,children:r}),i&&(0,I.jsx)(`div`,{className:`flex justify-end gap-2 border-t px-5 py-3`,children:i})]})}):null}function lt({icon:e,title:t,hint:n,action:r}){return(0,I.jsxs)(`div`,{className:`flex flex-col items-center justify-center gap-2 rounded-[var(--radius)] border border-dashed px-6 py-10 text-center`,children:[e&&(0,I.jsx)(`div`,{className:`text-[var(--color-muted)]`,children:e}),(0,I.jsx)(`p`,{className:`text-sm font-medium`,children:t}),n&&(0,I.jsx)(`p`,{className:`max-w-sm text-xs text-[var(--color-muted)]`,children:n}),r&&(0,I.jsx)(`div`,{className:`mt-1`,children:r})]})}function ut({title:e,subtitle:t,actions:n}){return(0,I.jsxs)(`div`,{className:`mb-5 flex flex-wrap items-end justify-between gap-3`,children:[(0,I.jsxs)(`div`,{children:[(0,I.jsx)(`h2`,{className:`text-lg font-semibold tracking-tight`,children:e}),t&&(0,I.jsx)(`p`,{className:`mt-0.5 text-sm text-[var(--color-muted)]`,children:t})]}),n&&(0,I.jsx)(`div`,{className:`flex items-center gap-2`,children:n})]})}var dt={inbox:{title:`Attività in ingresso`,intro:`Tutto ciò che ti arriva e devi gestire: mail che toccano l’infrastruttura, richieste, note di meeting. Ogni attività percorre una coda — Nuove → Viste → In corso → Chiuse — così non resta mai nulla fuori dal radar.`,sections:[{title:`La coda`,items:[`Scegli fonte (Mail / Meeting / ART Sync / Chat / Idea) e stream, poi incolla: una riga = un’attività. Entrano come «Nuove».`,`Avanza lo stato dal menu a tendina sulla riga: Nuove → Viste (l’hai letta) → In corso (ci stai lavorando) → Chiuse.`,`I filtri in alto mostrano quante ne hai per stato; «Aperte» è la vista di lavoro predefinita.`,`Un’attività ferma in «Nuove» da 3+ giorni viene segnalata: è il campanello che stai accumulando arretrato.`]},{title:`Urgenze e assegnazione`,items:[`Il pulsante ⚠ segna un’attività come URGENTE: bordo rosso e sempre in cima alla lista, in qualunque filtro.`,`Puoi marcare urgente anche in fase di inserimento, prima di incollare il blocco.`,`L’avatar assegna a una persona del team: l’attività RESTA in coda (così la monitori) e compare in Team & 1:1 → Deleghe.`,`Il menu ⋯ la smista dove serve: → Attività di oggi · → Card Kanban · → Ticket esterno · → Action item · → Porta in ART Sync · → Roadmap.`]},{title:`RACI`,items:[`Le lettere R A C I sulla riga aprono la matrice: Responsible (chi esegue) · Accountable (unico responsabile finale) · Consulted (da consultare) · Informed (da informare).`,`Un solo Accountable: è la regola che rende la RACI utile invece che decorativa.`,`Il tab «RACI» in alto è il quadro di monitoraggio: tutte le attività con una RACI definita, con chi fa cosa.`,`La RACI segue l’attività quando la porti nel Diario di oggi.`]},{title:`Buone pratiche`,items:[`Cattura subito, decidi dopo: incollare costa 2 secondi, ricostruire una richiesta persa costa un’ora.`,`Passa la coda almeno una volta al giorno: è un punto di transito, non un archivio.`,`Tagga sempre lo stream: è ciò che fa comporre da sola l’agenda dell’ART Sync.`]}],cadence:`Cattura in continuo · passa la coda almeno 1 volta al giorno.`},daily:{title:`Oggi`,intro:`La tua plancia giornaliera: cosa apri al mattino e chiudi a sera. Pochi elementi, ad alta frequenza.`,sections:[{title:`Come si usa`,items:[`«Quadro completo» in cima: da smistare · dipendenze a rischio · deleghe ferme · action aperte · backlog da ricontrollare. Se è tutto a zero non ti sei perso niente; clicca un numero per andare alla sezione.`,`Le 3 priorità di oggi: scrivi al massimo 3 cose che devono chiudersi oggi. Si salvano per data, ogni giorno riparti da zero.`,`Diario: incolla più righe per aggiungere tante attività insieme; ogni riga ha stream, assegnatario e menu ⋯ (→ Kanban, → ART Sync, → domani).`,`Focus della settimana: 3 obiettivi più ampi che restano fissi per tutta la settimana.`,`1:1 in arrivo e Azioni in scadenza: pannelli automatici di sola lettura, alimentati da Team e da Decisioni & Azioni.`]},{title:`Buone pratiche`,items:[`Limita a 3: se tutto è prioritario, niente lo è.`,`Svuota la quick capture ogni giorno: è la tua «inbox mentale», non un archivio.`,`Apri questa sezione come primissima cosa della giornata, prima delle email.`]}],cadence:`Ogni giorno — apertura al mattino, chiusura a fine giornata.`},standup:{title:`Standup`,intro:`Il Daily Scrum: ispeziona i progressi verso l’obiettivo di sprint e adatta il piano. Qui chiudi la giornata e generi il daily da presentare il giorno dopo.`,sections:[{title:`Come si usa`,items:[`A fine giornata apri «Chiudi la giornata»: l’app pre-compila «Fatto oggi», «Non finite» e «Impedimenti» dai tuoi dati (card chiuse, priorità spuntate, card in corso/bloccate).`,`Correggi le liste e aggiungi le «Note del giorno», poi «Salva chiusura giornata».`,`A destra trovi lo standup pronto (Ieri · Oggi · Impedimenti) con l’obiettivo di sprint in testa: usa «Copia» per incollarlo in Teams/Slack o leggerlo al daily.`,`Il menù a tendina ti fa rivedere e copiare anche gli standup dei giorni passati.`]},{title:`Buone pratiche (agile)`,items:[`Daily timeboxato a 15 minuti: parla di flusso e obiettivo di sprint, non di status burocratico.`,`Gli impedimenti emersi vanno risolti dopo il daily, non durante: annotali e portali a chi può sbloccarli.`,`«Non finite» che si ripetono per più giorni sono un segnale: la card è troppo grande o c’è un blocco nascosto.`]}],cadence:`Chiusura a fine giornata · standup il mattino dopo, sempre alla stessa ora.`},artsync:{title:`ART Sync`,intro:`Evento SAFe facilitato dall’RTE: unisce il Coach Sync (ex Scrum of Scrums, lato esecuzione) e il PO Sync (lato scope e priorità). Qui l’agenda è la TUA: le sezioni che presenti davvero, già compilate dai tuoi dati.`,sections:[{title:`Come si usa`,items:[`La mattina apri la data di oggi: l’agenda mostra le tue sezioni (CCoE · Digital CCoE · Progress Internal Team · External Dependencies · External Meeting · Rischi ROAM).`,`«↻ componi» riempie la sezione dai tuoi dati: attività e action taggate con quello stream, dipendenze aperte, item del backlog esterno che monitori.`,`Durante il meeting spunta «riportato» su ogni punto e usa la nota per annotare cosa è emerso.`,`I rischi vivono in un registro persistente: restano di sync in sync (con owner e aging) finché non li marchi Resolved. Il check «riportato» invece è per-giornata.`,`Le action in uscita: assegna owner con l’avatar e portale nella giornata con «→ Diario» (stato collegato) o «→ Kanban». Le ritrovi in «Decisioni & Azioni» e in «Team → Deleghe».`,`«Copia» genera il testo già nel tuo formato di presentazione (CCoE: … Digital CCoE: …), pronto da incollare.`,`Il pulsante «Agenda» ti fa rinominare, riordinare, aggiungere o togliere sezioni: l’app si adatta a come presenti tu.`]},{title:`Le regole (SAFe)`,items:[`Timebox 30-60 minuti: nel sync si IDENTIFICANO i problemi, non si risolvono. Il confronto tecnico va nel «meet after».`,`Da ogni ART Sync deve uscire almeno un’action con owner e data: senza owner, nulla si muove.`,`I rischi si gestiscono con ROAM: Resolved (risolto), Owned (qualcuno lo prende in carico), Accepted (accettato così com’è), Mitigated (c’è un piano di mitigazione).`,`Le dipendenze cross-team vanno rese visibili il prima possibile: sono la causa principale di ritardo sul PI.`]}],cadence:`Preparazione ogni mattina prima del meeting · action gestite nella giornata.`},kanban:{title:`Kanban personale`,intro:`Il TUO lavoro da manager, non i task del team: hiring, vendor, escalation, decisioni, architettura.`,sections:[{title:`Come si usa`,items:[`Crea con «Nuova card» o «+ Aggiungi» direttamente nella colonna voluta.`,`Trascina le card tra le colonne: Backlog → Da fare → In corso → Bloccato → Fatto.`,`Click su una card per modificarla: priorità, tag, note.`,`Il contatore «WIP in corso» in alto e l’etichetta «fermo da Ng» (card non mossa da ≥7 giorni) sono i tuoi due semafori.`]},{title:`Buone pratiche`,items:[`WIP limit su te stesso: max 2-3 card «In corso». Oltre, è solo context switching.`,`Usa «Bloccato» e nelle note scrivi da chi/cosa dipende: i blocchi vanno resi visibili, non nascosti.`,`Ogni settimana rivedi le card «ferme da»: o le sblocchi, o le chiudi.`]}],cadence:`Aggiorna durante la giornata · review delle card ferme una volta a settimana.`},dependencies:{title:`Ticket`,intro:`Il registro dei ticket che apri verso i team esterni (CCoE, Digital CCoE, RunOps…) e di quelli che segui dal loro backlog. Sono la «D» del RAID log e la causa #1 di lavoro fermo: qui restano sempre sotto controllo.`,sections:[{title:`Come si usa`,items:[`Le schede in alto danno lo stato per interlocutore a colpo d’occhio: 🔴 da escalare · 🟡 da sollecitare · 🟢 sotto controllo. Cliccale per filtrare.`,`Aggiunta rapida: seleziona l’interlocutore e scrivi «INC0012345 apertura firewall» — il riferimento viene staccato in automatico.`,`Il campo «Origine» distingue i ticket aperti da noi da quelli presi dal LORO backlog che stai solo monitorando.`,`Clicca il titolo per la scheda completa: tipo, link, criticità, «needed by», chi lo segue, cosa blocca.`,`«Sollecita» registra il follow-up: dopo 3 solleciti il ticket viene marcato «da escalare» — a quel punto portalo al tuo responsabile o all’RTE.`]},{title:`Buone pratiche (agile)`,items:[`Ogni dipendenza ha un owner esplicito: senza un responsabile che la insegue, resta ferma.`,`Imposta sempre il «needed by»: una dipendenza senza data non è prioritizzabile.`,`Rendi visibili le dipendenze cross-team il prima possibile (planning / PI planning): si gestiscono prevenendo, non rincorrendo.`,`Una dipendenza «ferma da» troppo tempo va escalata, non solo sollecitata: dopo 3 solleciti l’app la marca «da escalare» — a quel punto portala al tuo responsabile o all’RTE.`]}],cadence:`Rivedi le aperte ogni giorno · sollecita le critiche prima che scadano.`},roadmap:{title:`Roadmap DevOps`,intro:`La tua direzione tecnica come DevOps manager: iniziative (non task) su tre orizzonti Now/Next/Later. Niente date finte: l’impegno cresce man mano che l’orizzonte si avvicina.`,sections:[{title:`Come si usa`,items:[`Tre colonne: «Adesso» (in lavorazione / prossime settimane), «Prossimo» (prossimo trimestre o PI), «Più avanti» (visione, senza impegno).`,`Aggiungi un’iniziativa con «+ aggiungi e Invio» o col pulsante; trascina tra le colonne quando le priorità cambiano.`,`Ogni iniziativa ha area (CI/CD, Observability, Security, FinOps…), stato e target indicativo (es. Q4 2026).`,`«Kanban» su un’iniziativa crea la card operativa e la mette In corso: la roadmap dice il perché, il Kanban il cosa questa settimana.`,`Le iniziative «Adesso» compaiono anche nel Report.`]},{title:`Buone pratiche`,items:[`Tieni «Adesso» a massimo 3-4 iniziative attive: una roadmap dove è tutto «adesso» non è una roadmap.`,`Rivedila una volta al mese e a ogni PI planning: promuovi da Later → Next → Now, e non aver paura di retrocedere.`,`«Più avanti» è una lista di intenzioni, non di promesse: lì la vaghezza è una funzionalità.`,`Ogni iniziativa dovrebbe dire il valore atteso, non solo il titolo tecnico.`]}],cadence:`Review mensile · riallineamento a ogni PI planning.`},team:{title:`Team & 1:1`,intro:`La memoria sulle tue persone: 1:1, obiettivi, skill. Serve ad arrivare alle review senza sorprese e a far crescere il team in modo intenzionale.`,sections:[{title:`Tab «Schede»`,items:[`Aggiungi persona e compila ruolo, skill (tag), obiettivi del trimestre, note.`,`Imposta «Prossimo 1:1»: la data comparirà automaticamente nella sezione Oggi.`,`Registra 1:1: scrivi le note, opzionale il mood (emoji), premi «Registra». Resta storicizzato con la data.`]},{title:`Tab «Skill matrix»`,items:[`Aggiungi le competenze (le colonne); click su una cella per impostare il livello: Base → Solido → Esperto.`,`Sotto ogni competenza «coperte» = quante persone sono almeno Solido. In rosso (0) = single point of failure.`]},{title:`Tab «Deleghe»`,items:[`Il quadro di cosa hai passato a chi: attività del diario e action, raggruppate per persona, con stato e da quanto tempo sono ferme.`,`Assegni dall’avatar nel Diario di oggi, nell’Inbox o nell’ART Sync; qui monitori senza rincorrere.`,`«ferme ≥5g» è il segnale per riparlarne al prossimo 1:1 — o per capire se la persona è bloccata.`]},{title:`Buone pratiche`,items:[`Prepara ogni 1:1 rileggendo il precedente: dai continuità e chiedi i follow-up.`,`Guarda l’andamento del mood nel tempo, non il singolo: un calo costante è un segnale da intercettare.`,`Competenze con copertura 0-1 = rischio bus factor: pianifica formazione o pairing.`]}],cadence:`1:1 a cadenza fissa (es. ogni 2 settimane) · skill matrix rivista ogni mese/trimestre.`},sprint:{title:`Sprint & Salute`,intro:`Collega la cadenza di consegna (sprint/PI) con la salute del team misurata nel tempo.`,sections:[{title:`Tab «Sprint / Train»`,items:[`A inizio sprint: crea lo sprint, stato «Attivo», scrivi gli obiettivi.`,`A fine sprint: riaprilo, compila la retro (cosa è andato bene / cosa migliorare) e metti stato «Chiuso».`,`Rischi & impedimenti: sono trasversali, te li porti tra sprint. Severità + stato ciclabile (Aperto → Mitigato → Chiuso).`]},{title:`Tab «Salute DORA»`,items:[`Una volta a settimana dai un voto 1-5 alle 4 metriche (lead time, freq. deploy, MTTR, change failure) + due righe di note.`,`È un self-rating soggettivo da manager, non un dato estratto dai sistemi: serve a percepire la tendenza.`,`Leggi il grafico di trend, non il numero secco: conta la direzione.`]},{title:`Buone pratiche`,items:[`Il «cosa migliorare» della retro deve diventare un’azione concreta nel Kanban o negli Action items, altrimenti è solo uno sfogo.`,`DORA: scegli un giorno fisso (es. venerdì) per non saltare la valutazione.`,`Un rischio «Aperto» da troppo tempo va escalato agli stakeholder.`]}],cadence:`Retro a fine sprint · DORA una volta a settimana, sempre lo stesso giorno.`},decisions:{title:`Decisioni & Azioni`,intro:`Conserva il «perché» delle decisioni (che dimenticherai tra 3 mesi) e traccia gli action item con responsabile e scadenza.`,sections:[{title:`Tab «Decision log»`,items:[`Nuova decisione: compila contesto, alternative valutate, scelta e — soprattutto — il «perché» (razionale e trade-off accettati).`,`Stato: Aperta (in valutazione), Decisa, Da rivedere (da riconsiderare in futuro).`]},{title:`Tab «Action items»`,items:[`Aggiungi con owner e scadenza; click sul pallino per ciclare lo stato: Da fare → In corso → Fatto.`,`Le scadenze appaiono nella sezione Oggi; il campo owner si autocompleta dai nomi del team.`]},{title:`Buone pratiche`,items:[`Registra la decisione nel momento in cui la prendi: il razionale è fresco e onesto.`,`Una decisione «Da rivedere» è legittima: associa un trigger temporale per riconsiderarla.`,`Da ogni meeting esce almeno un action item con owner e data, altrimenti il meeting non è servito.`]}],cadence:`Decisioni: appena le prendi · Action items: dopo ogni meeting.`},report:{title:`Report`,intro:`Un’istantanea sintetica per i tuoi resoconti: 1:1 col tuo responsabile, weekly, allineamenti verso l’alto.`,sections:[{title:`Come si usa`,items:[`È un’anteprima generata in automatico da tutte le altre sezioni: non si compila a mano.`,`«Stampa / Salva PDF» → nella finestra di stampa scegli «Salva come PDF» come stampante.`,`In stampa spariscono sidebar e pulsanti: resta solo il foglio pulito.`,`Tab «Chiusura settimana»: il venerdì l’app ti mostra i numeri della settimana (attività, card, dipendenze, rischi, cycle time) — tu aggiungi «cosa è andato bene» e «cosa migliorare» e chiudi. La chiusura finisce nel Report.`,`Il «cosa migliorare» ha «→ Crea action item»: la retro senza azione è solo uno sfogo.`]},{title:`Buone pratiche`,items:[`Se tieni aggiornate le altre sezioni durante la settimana, il report si scrive da solo.`,`Usalo come base oggettiva per la comunicazione verso l’alto: numeri e fatti, non sensazioni.`]}],cadence:`A richiesta — tipicamente a fine settimana o prima di un allineamento.`}};function ft({section:e}){let[t,n]=(0,l.useState)(!1),r=dt[e];return(0,I.jsxs)(I.Fragment,{children:[(0,I.jsxs)(z,{variant:`ghost`,size:`sm`,onClick:()=>n(!0),title:`Guida alla sezione`,children:[(0,I.jsx)(at,{width:15,height:15}),` Guida`]}),(0,I.jsx)(ct,{open:t,onClose:()=>n(!1),title:`Guida · ${r.title}`,wide:!0,footer:(0,I.jsx)(z,{variant:`primary`,onClick:()=>n(!1),children:`Ho capito`}),children:(0,I.jsxs)(`div`,{className:`space-y-4`,children:[(0,I.jsx)(`p`,{className:`text-sm text-[var(--color-muted)]`,children:r.intro}),r.sections.map(e=>(0,I.jsxs)(`div`,{children:[(0,I.jsx)(`h4`,{className:`mb-1.5 text-xs font-semibold uppercase tracking-wide text-[var(--color-primary)]`,children:e.title}),(0,I.jsx)(`ul`,{className:`space-y-1.5`,children:e.items.map((e,t)=>(0,I.jsxs)(`li`,{className:`flex gap-2 text-sm leading-snug`,children:[(0,I.jsx)(`span`,{className:`mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-[var(--color-border)]`}),(0,I.jsx)(`span`,{children:e})]},t))})]},e.title)),(0,I.jsxs)(`div`,{className:`rounded-[calc(var(--radius)-0.25rem)] border bg-[var(--color-surface-2)]/50 px-3 py-2 text-sm`,children:[(0,I.jsx)(`span`,{className:`font-semibold`,children:`Ritmo consigliato: `}),(0,I.jsx)(`span`,{className:`text-[var(--color-muted)]`,children:r.cadence})]})]})})]})}function pt({items:e}){let[t,n]=(0,l.useState)(!1);return(0,I.jsxs)(`div`,{className:`relative shrink-0`,children:[(0,I.jsx)(`button`,{onClick:e=>{e.stopPropagation(),n(e=>!e)},className:`grid h-7 w-7 place-items-center rounded-md text-[var(--color-muted)] hover:bg-[var(--color-surface-2)]`,"aria-label":`Azioni`,children:(0,I.jsx)(Xe,{width:16,height:16})}),t&&(0,I.jsxs)(I.Fragment,{children:[(0,I.jsx)(`div`,{className:`fixed inset-0 z-40`,onClick:()=>n(!1)})
